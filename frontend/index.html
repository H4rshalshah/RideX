<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ridex.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="RideX — book a ride in minutes. Quick booking, live tracking, transparent fares and verified drivers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>RideX — Book a ride in minutes</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // A ?theme=light|dark query param overrides it (handy for previews).
      (function () {
        try {
          var t = localStorage.getItem('ridex-theme');
          var qp = new URLSearchParams(window.location.search).get('theme');
          if (qp === 'light' || qp === 'dark') t = qp;
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
